<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logo Steril - Sunnys Schätze</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .container {
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .container img {
            display: block;

            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            object-fit: contain;
            object-position: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <img
            src="Sunnys Schätze Logo Steril.png"
            alt="Sunnys Schätze Logo Steril"
        >
    </div>

</body>
</html>
