<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunnys Schätze – RGB Logo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
        }

        /* Google-Sites-Einbettungsbereich */
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            isolation: isolate;
        }

        /*
         * Gemeinsame Ebene:
         * Hintergrund und Schrift werden zusammen skaliert.
         */
        .szene {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 1350px;

            transform:
                translate(-50%, -50%)
                scale(var(--scene-scale, 1));

            transform-origin: center center;
        }

        /* Hintergrund */
        .hintergrund {
            display: block;
            width: 1350px;
            height: auto;
        }

        /* Schrift */
        .logo-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 1000px;

            transform: translate(-50%, -50%);
            transition: transform 0.7s ease;

            z-index: 2;
            cursor: pointer;
        }

        .schrift {
            display: block;
            position: relative;

            width: 100%;
            height: auto;

            z-index: 3;
            transition: filter 0.5s ease;
        }

        /* RGB-Leuchtschicht */
        .rgb-glow {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;
            pointer-events: none;

            z-index: 1;
            transition: opacity 0.7s ease;
        }

        /* Hover nur bei Mausbedienung */
        @media (hover: hover) and (pointer: fine) {
            .logo-wrapper:hover {
                transform:
                    translate(-50%, -50%)
                    scale(1.05);
            }

            .logo-wrapper:hover .rgb-glow {
                opacity: 0.9;
                animation: rgbBackground 8s linear infinite;
            }

            .logo-wrapper:hover .schrift {
                animation: rgbGlow 8s linear infinite;
            }
        }

        /* RGB-Farbwechsel */
        @keyframes rgbGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 10px red)
                    drop-shadow(0 0 25px red);
            }

            16% {
                filter:
                    drop-shadow(0 0 10px magenta)
                    drop-shadow(0 0 25px magenta);
            }

            33% {
                filter:
                    drop-shadow(0 0 10px blue)
                    drop-shadow(0 0 25px blue);
            }

            50% {
                filter:
                    drop-shadow(0 0 10px cyan)
                    drop-shadow(0 0 25px cyan);
            }

            66% {
                filter:
                    drop-shadow(0 0 10px lime)
                    drop-shadow(0 0 25px lime);
            }

            83% {
                filter:
                    drop-shadow(0 0 10px yellow)
                    drop-shadow(0 0 25px yellow);
            }
        }

        @keyframes rgbBackground {
            0%, 100% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px red);
            }

            16% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px magenta);
            }

            33% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px blue);
            }

            50% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px cyan);
            }

            66% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px lime);
            }

            83% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px yellow);
            }
        }

        /* Reduzierte Bewegung */
        @media (prefers-reduced-motion: reduce) {
            .logo-wrapper,
            .schrift,
            .rgb-glow {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="container">

        <div class="szene" id="szene">

            <!-- Hintergrund -->
            <img
                class="hintergrund"
                id="hintergrund"
                src="Sunnys Schätze Logo Steril ohne Schrift.png"
                alt="Sunnys Schätze Hintergrund"
            >

            <!-- Schrift -->
            <div class="logo-wrapper">

                <img
                    class="rgb-glow"
                    src="Sunnys Schätze Logo Steril Schrift.png"
                    alt=""
                >

                <img
                    class="schrift"
                    src="Sunnys Schätze Logo Steril Schrift.png"
                    alt="Sunnys Schätze Schrift"
                >

            </div>

        </div>

    </div>

    <script>
        const container = document.getElementById("container");
        const szene = document.getElementById("szene");
        const hintergrund = document.getElementById("hintergrund");

        function anpassen() {
            const breite = container.clientWidth;
            const hoehe = container.clientHeight;

            const originalBreite = 1350;
            const originalHoehe =
                hintergrund.naturalWidth > 0
                    ? originalBreite *
                      hintergrund.naturalHeight /
                      hintergrund.naturalWidth
                    : szene.offsetHeight;

            /*
             * Skalierung anhand von Breite UND Höhe.
             * Dadurch bleibt die gesamte Szene sichtbar.
             */
            const skalierung = Math.min(
                breite / originalBreite,
                hoehe / originalHoehe,
                1
            );

            szene.style.setProperty(
                "--scene-scale",
                skalierung
            );
        }

        hintergrund.addEventListener("load", anpassen);

        window.addEventListener("resize", anpassen);

        if ("ResizeObserver" in window) {
            const observer = new ResizeObserver(anpassen);
            observer.observe(container);
        }

        anpassen();
    </script>

</body>
</html>
