<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunnys Schätze – RGB Logo</title>

<style>

/* =========================================
   GRUNDEINSTELLUNGEN
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
}

/* =========================================
   RESPONSIVER HAUPTCONTAINER
========================================= */

.container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;

    width: 100%;
    height: 100%;

    background: #000;
    overflow: hidden;
    isolation: isolate;

    container-type: size;
}

/* =========================================
   BILDBEREICH
========================================= */

.bildbereich {
    position: relative;

    /* Passt sich Breite und Höhe an */
    width: min(100%, 1350px, 300cqh);

    aspect-ratio: 2048 / 682;
    flex: none;

    background: #000;
    overflow: hidden;
}

/* =========================================
   HINTERGRUND
========================================= */

.hintergrund {
    position: absolute;
    inset: 0;

    display: block;
    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 0;
    pointer-events: none;
}

/* =========================================
   SCHWARZER STREIFEN

   PC / Tablet: 2 Pixel
   Smartphone: 1 Pixel

   Liegt hinter Sunny.
========================================= */

.bildbereich::after {
    content: "";

    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 2px;
    background: #000;

    z-index: 1;
    pointer-events: none;
}

/* =========================================
   LOGO-SCHRIFT
========================================= */

.logo-wrapper {
    position: absolute;

    top: 50%;
    left: 50%;
    width: 74%;

    transform: translate(-50%, -50%);
    transform-origin: center;

    transition: transform 0.5s ease;

    z-index: 3;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.schrift {
    position: relative;
    display: block;

    width: 100%;
    height: auto;

    z-index: 2;
    pointer-events: none;
}

/* =========================================
   RGB-LEUCHTSCHICHT
========================================= */

.rgb-glow {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    opacity: 0;
    pointer-events: none;

    z-index: 1;
    transition: opacity 0.4s ease;
}

/* RGB bei Mausbewegung */
@media (hover: hover) and (pointer: fine) {

    .logo-wrapper:hover {
        transform:
            translate(-50%, -50%)
            scale(1.05);
    }

    .logo-wrapper:hover .rgb-glow {
        opacity: 0.9;
        animation: rgbBackground 8s linear infinite;
    }

    .logo-wrapper:hover .schrift {
        animation: rgbGlow 8s linear infinite;
    }
}

/* RGB beim Antippen */
.logo-wrapper.aktiv {
    transform:
        translate(-50%, -50%)
        scale(1.05);
}

.logo-wrapper.aktiv .rgb-glow {
    opacity: 0.9;
    animation: rgbBackground 8s linear infinite;
}

.logo-wrapper.aktiv .schrift {
    animation: rgbGlow 8s linear infinite;
}

/* =========================================
   RGB-FARBWECHSEL
========================================= */

@keyframes rgbGlow {

    0%, 100% {
        filter:
            drop-shadow(0 0 10px red)
            drop-shadow(0 0 25px red);
    }

    16% {
        filter:
            drop-shadow(0 0 10px magenta)
            drop-shadow(0 0 25px magenta);
    }

    33% {
        filter:
            drop-shadow(0 0 10px blue)
            drop-shadow(0 0 25px blue);
    }

    50% {
        filter:
            drop-shadow(0 0 10px cyan)
            drop-shadow(0 0 25px cyan);
    }

    66% {
        filter:
            drop-shadow(0 0 10px lime)
            drop-shadow(0 0 25px lime);
    }

    83% {
        filter:
            drop-shadow(0 0 10px yellow)
            drop-shadow(0 0 25px yellow);
    }
}

@keyframes rgbBackground {

    0%, 100% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px red);
    }

    16% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px magenta);
    }

    33% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px blue);
    }

    50% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px cyan);
    }

    66% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px lime);
    }

    83% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px yellow);
    }
}

/* =========================================
   SUNNY – LAUFEBENE
========================================= */

/*
   36 Sekunden pro Zyklus:

   0–12 s:  Sunny läuft nach rechts
   12–18 s: Pause
   18–30 s: Sunny läuft nach links
   30–36 s: Pause
*/

.laufebene {
    position: absolute;
    inset: 0;

    z-index: 10;

    overflow: hidden;
    pointer-events: none;
}

.laufspur {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 3%;

    height: 58%;

    --sunny-breite: 15%;

    pointer-events: none;
}

.sunny-runner {
    position: absolute;

    left: 0;
    bottom: 0;

    width: var(--sunny-breite);
    height: auto;

    opacity: 0;

    transform-origin: 50% 85%;
    backface-visibility: hidden;

    pointer-events: none;
}

/* =========================================
   NATÜRLICHER LAUFSCHRITT
========================================= */

.sunny-bild {
    display: block;

    width: 100%;
    height: auto;

    transform-origin: 50% 85%;

    animation:
        laufSchritt 0.38s ease-in-out
        infinite alternate;
}

.sunny-nach-links .sunny-bild {
    animation-delay: -0.19s;
}

@keyframes laufSchritt {

    from {
        transform:
            translateY(0)
            rotate(-1.2deg)
            scaleY(1);
    }

    to {
        transform:
            translateY(-3%)
            rotate(1.2deg)
            scaleY(0.99);
    }
}

/* =========================================
   LAUFANIMATION NACH RECHTS
========================================= */

.sunny-nach-rechts {
    animation: laufRechts 36s linear infinite;
}

@keyframes laufRechts {

    0% {
        transform: translateX(-110%);
        opacity: 0;
    }

    1% {
        opacity: 1;
    }

    32.5% {
        opacity: 1;
    }

    33.333% {
        transform: translateX(var(--strecke-rechts));
        opacity: 0;
    }

    33.334%,
    100% {
        transform: translateX(var(--strecke-rechts));
        opacity: 0;
    }
}

/* =========================================
   LAUFANIMATION NACH LINKS
========================================= */

.sunny-nach-links {
    animation: laufLinks 36s linear infinite;
}

@keyframes laufLinks {

    0%,
    49.999% {
        transform: translateX(var(--strecke-rechts));
        opacity: 0;
    }

    50% {
        transform: translateX(var(--strecke-rechts));
        opacity: 0;
    }

    51% {
        opacity: 1;
    }

    82.5% {
        opacity: 1;
    }

    83.333% {
        transform: translateX(-110%);
        opacity: 0;
    }

    83.334%,
    100% {
        transform: translateX(-110%);
        opacity: 0;
    }
}

/* =========================================
   TABLETS
========================================= */

@media (max-width: 1024px) {

    .laufspur {
        bottom: 4%;
        --sunny-breite: 13%;
    }
}

/* =========================================
   SMARTPHONES
========================================= */

@media (max-width: 767px) {

    .bildbereich {
        width: min(100%, 300cqh);
    }

    .logo-wrapper {
        width: 74%;
    }

    /*
       Smartphone:
       schwarzer Streifen nur 1 Pixel
    */
    .bildbereich::after {
        height: 1px;
    }

    .laufspur {
        bottom: 6%;
        height: 55%;

        --sunny-breite: 11%;
    }

    .sunny-bild {
        animation-duration: 0.42s;
    }
}

/* =========================================
   SEHR KLEINE SMARTPHONES
========================================= */

@media (max-width: 400px) {

    .laufspur {
        bottom: 7%;
        --sunny-breite: 10%;
    }

    /*
       Bleibt auch hier bei 1 Pixel.
    */
    .bildbereich::after {
        height: 1px;
    }
}

/* =========================================
   QUERFORMAT
========================================= */

@media (max-height: 450px) and (orientation: landscape) {

    .laufspur {
        bottom: 4%;
    }
}

/* =========================================
   BARRIEREFREIHEIT
========================================= */

.logo-wrapper:focus-visible {
    outline: 2px solid cyan;
    outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {

    .logo-wrapper,
    .schrift,
    .rgb-glow,
    .sunny-runner,
    .sunny-bild {
        animation: none !important;
        transition: none !important;
    }

    .sunny-nach-rechts {
        opacity: 1;
        transform: translateX(10%);
    }

    .sunny-nach-links {
        display: none;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="bildbereich">

        <!-- Hintergrund -->
        <img
            class="hintergrund"
            src="Sunnys Schätze Logo Steril ohne Schrift.png"
            alt=""
            width="2048"
            height="682"
            decoding="async"
            fetchpriority="high"
        >

        <!-- RGB-Schrift -->
        <div
            class="logo-wrapper"
            id="logo"
            role="button"
            tabindex="0"
            aria-label="RGB-Effekt aktivieren"
            aria-pressed="false"
        >

            <!-- RGB-Leuchtschicht -->
            <img
                class="rgb-glow"
                src="Sunnys Schätze Logo Steril Schrift.png"
                alt=""
                width="2048"
                height="684"
                decoding="async"
            >

            <!-- Sichtbare Schrift -->
            <img
                class="schrift"
                src="Sunnys Schätze Logo Steril Schrift.png"
                alt="Sunnys Schätze"
                width="2048"
                height="684"
                decoding="async"
                fetchpriority="high"
            >

        </div>

        <!-- SUNNY IM VORDERGRUND -->
        <div class="laufebene" aria-hidden="true">

            <div class="laufspur" id="laufspur">

                <!-- Sunny läuft nach rechts -->
                <div class="sunny-runner sunny-nach-rechts">

                    <img
                        class="sunny-bild"
                        src="Sunny the Dragon Slayer Rennt von Links nach Rechts.png"
                        alt=""
                        decoding="async"
                    >

                </div>

                <!-- Sunny läuft nach links -->
                <div class="sunny-runner sunny-nach-links">

                    <img
                        class="sunny-bild"
                        src="Sunny the Dragon Slayer Rennt von Rechts nach Links.png"
                        alt=""
                        decoding="async"
                    >

                </div>

            </div>

        </div>

    </div>

</div>

<script>

/* =========================================
   RGB-EFFEKT
========================================= */

const logo = document.getElementById("logo");

function toggleRGB() {

    const aktiv = logo.classList.toggle("aktiv");

    logo.setAttribute(
        "aria-pressed",
        String(aktiv)
    );
}

/* Smartphone: Antippen */
logo.addEventListener("click", function() {

    if (window.matchMedia("(hover: none)").matches) {
        toggleRGB();
    }
});

/* Tastatur: Enter und Leertaste */
logo.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" ||
        event.key === " "
    ) {
        event.preventDefault();
        toggleRGB();
    }
});

/* =========================================
   RESPONSIVE LAUFSTRECKE
========================================= */

const laufspur = document.getElementById("laufspur");
const sunny = laufspur.querySelector(".sunny-runner");

function laufstreckeAktualisieren() {

    const spurBreite = laufspur.clientWidth;
    const sunnyBreite = sunny.getBoundingClientRect().width;

    /*
       Sunny startet links außerhalb.

       Die Zielposition liegt rechts
       außerhalb des sichtbaren Bereichs.
    */

    const ziel = spurBreite + sunnyBreite * 0.1;

    laufspur.style.setProperty(
        "--strecke-rechts",
        ziel + "px"
    );
}

/* Beim Laden */
laufstreckeAktualisieren();

/* Bei Größenänderungen */
if ("ResizeObserver" in window) {

    const resizeObserver = new ResizeObserver(
        laufstreckeAktualisieren
    );

    resizeObserver.observe(laufspur);

} else {

    window.addEventListener(
        "resize",
        laufstreckeAktualisieren
    );
}

</script>

</body>
</html>
