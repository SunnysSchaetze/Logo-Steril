
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Steril</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        .container img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Sunnys Schätze Logo Steril.png"
             alt="Sunnys Schätze Logo Steril">
    </div>

</body>
</html>
