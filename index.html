<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunnys Schätze – RGB Logo</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
.container{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:#000;overflow:hidden;isolation:isolate;container-type:size}
.bildbereich{position:relative;width:min(100%,1350px,300cqh);aspect-ratio:2048/682;flex:none;background:#000;overflow:hidden}
.hintergrund{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;z-index:0;pointer-events:none}
/* Schwarzer Streifen hinter Sunny: PC/Tablet 2px */
.bildbereich::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:#000;z-index:1;pointer-events:none}
.logo-wrapper{position:absolute;top:50%;left:50%;width:74%;transform:translate(-50%,-50%);transform-origin:center;transition:transform .5s ease;z-index:3;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.schrift{position:relative;display:block;width:100%;height:auto;z-index:2;pointer-events:none}
.rgb-glow{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none;z-index:1;transition:opacity .4s ease}
@media(hover:hover) and (pointer:fine){.logo-wrapper:hover{transform:translate(-50%,-50%) scale(1.05)}.logo-wrapper:hover .rgb-glow{opacity:.9;animation:rgbBackground 8s linear infinite}.logo-wrapper:hover .schrift{animation:rgbGlow 8s linear infinite}}
.logo-wrapper.aktiv{transform:translate(-50%,-50%) scale(1.05)}
.logo-wrapper.aktiv .rgb-glow{opacity:.9;animation:rgbBackground 8s linear infinite}
.logo-wrapper.aktiv .schrift{animation:rgbGlow 8s linear infinite}
@keyframes rgbGlow{0%,100%{filter:drop-shadow(0 0 10px red) drop-shadow(0 0 25px red)}16%{filter:drop-shadow(0 0 10px magenta) drop-shadow(0 0 25px magenta)}33%{filter:drop-shadow(0 0 10px blue) drop-shadow(0 0 25px blue)}50%{filter:drop-shadow(0 0 10px cyan) drop-shadow(0 0 25px cyan)}66%{filter:drop-shadow(0 0 10px lime) drop-shadow(0 0 25px lime)}83%{filter:drop-shadow(0 0 10px yellow) drop-shadow(0 0 25px yellow)}}
@keyframes rgbBackground{0%,100%{filter:blur(12px) drop-shadow(0 0 35px red)}16%{filter:blur(12px) drop-shadow(0 0 35px magenta)}33%{filter:blur(12px) drop-shadow(0 0 35px blue)}50%{filter:blur(12px) drop-shadow(0 0 35px cyan)}66%{filter:blur(12px) drop-shadow(0 0 35px lime)}83%{filter:blur(12px) drop-shadow(0 0 35px yellow)}}
/* Sunny: 12s rechts, 6s Pause, 12s links, 6s Pause */
.laufebene{position:absolute;inset:0;z-index:10;overflow:hidden;pointer-events:none}
.laufspur{position:absolute;left:0;right:0;bottom:3%;height:58%;--sunny-breite:15%;--strecke-rechts:1200px;pointer-events:none}
.sunny-runner{position:absolute;left:0;bottom:0;width:var(--sunny-breite);height:auto;opacity:0;transform-origin:50% 85%;backface-visibility:hidden;pointer-events:none}
.sunny-bild{display:block;width:100%;height:auto;transform-origin:50% 85%;animation:laufSchritt .38s ease-in-out infinite alternate}
.sunny-nach-links .sunny-bild{animation-delay:-.19s}
@keyframes laufSchritt{from{transform:translateY(0) rotate(-1.2deg) scaleY(1)}to{transform:translateY(-3%) rotate(1.2deg) scaleY(.99)}}
.sunny-nach-rechts{animation:laufRechts 36s linear infinite}
.sunny-nach-links{animation:laufLinks 36s linear infinite}
@keyframes laufRechts{0%{transform:translateX(-110%);opacity:0}1%{opacity:1}32.5%{opacity:1}33.333%{transform:translateX(var(--strecke-rechts));opacity:0}33.334%,100%{transform:translateX(var(--strecke-rechts));opacity:0}}
@keyframes laufLinks{0%,49.999%{transform:translateX(var(--strecke-rechts));opacity:0}50%{transform:translateX(var(--strecke-rechts));opacity:0}51%{opacity:1}82.5%{opacity:1}83.333%{transform:translateX(-110%);opacity:0}83.334%,100%{transform:translateX(-110%);opacity:0}}
@media(max-width:1024px){.laufspur{bottom:4%;--sunny-breite:13%}}
@media(max-width:767px){.bildbereich{width:min(100%,300cqh)}.bildbereich::after{height:1px}.laufspur{bottom:6%;height:55%;--sunny-breite:11%}.sunny-bild{animation-duration:.42s}}
@media(max-width:400px){.laufspur{bottom:7%;--sunny-breite:10%}}
@media(max-height:450px) and (orientation:landscape){.laufspur{bottom:4%}}
.logo-wrapper:focus-visible{outline:2px solid cyan;outline-offset:4px}
@media(prefers-reduced-motion:reduce){.logo-wrapper,.schrift,.rgb-glow,.sunny-runner,.sunny-bild{animation:none!important;transition:none!important}.sunny-nach-rechts{opacity:1;transform:translateX(10%)}.sunny-nach-links{display:none}.glitzer,.staub,.klick-flash{display:none!important}}
/* ORIGINAL: Sternenstaub und Klickexplosion aus deiner Datei */
/* =========================================================
   CURSOR-SYSTEM – REFERENZ
   ========================================================= */

.glitzer {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 99999;
    width: var(--size);
    height: var(--size);
    opacity: 0;
    transform: translate(-50%, -50%);
    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fffde8 10%,
            var(--color) 28%,
            rgba(255,180,0,.60) 45%,
            transparent 72%
        );
    border-radius: 50%;
    filter:
        drop-shadow(0 0 3px var(--color))
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 12px rgba(255,150,0,.45));
    animation:
        cursorTrail
        var(--duration)
        cubic-bezier(.15,.55,.25,1)
        forwards;
}

.glitzer::before,
.glitzer::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.glitzer::before {
    width: 185%;
    height: 14%;
    background: linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.10),
        var(--color),
        #ffffff,
        var(--color),
        rgba(255,255,255,.10),
        transparent
    );
    border-radius: 999px;
    filter: blur(.3px);
}

.glitzer::after {
    width: 14%;
    height: 185%;
    background: linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,.10),
        var(--color),
        #ffffff,
        var(--color),
        rgba(255,255,255,.10),
        transparent
    );
    border-radius: 999px;
    filter: blur(.3px);
}

.glitzer.long {
    filter:
        drop-shadow(0 0 4px #ffffff)
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 13px var(--color))
        drop-shadow(0 0 19px rgba(255,145,0,.35));
}

.staub {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 99998;
    width: var(--staub-size);
    height: var(--staub-size);
    border-radius: 50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.72) 0%,
            var(--color) 28%,
            rgba(255,170,0,.42) 55%,
            transparent 100%
        );
    transform: translate(-50%, -50%);
    opacity: 0;
    box-shadow:
        0 0 4px var(--color),
        0 0 9px var(--color),
        0 0 16px rgba(255,150,0,.42),
        0 0 24px rgba(255,170,0,.18);
    animation:
        staubTrail
        var(--duration)
        ease-out
        forwards;
}

@keyframes cursorTrail {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(var(--sx), var(--sy))
            scale(.18);
    }

    10% {
        opacity: .95;
        transform:
            translate(-50%, -50%)
            translate(var(--sx), var(--sy))
            scale(1);
    }

    30% {
        opacity: .85;
        transform:
            translate(-50%, -50%)
            translate(var(--mx), var(--my))
            scale(.9);
    }

    60% {
        opacity: .48;
        transform:
            translate(-50%, -50%)
            translate(var(--ex), var(--ey))
            scale(.55);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(var(--ex), var(--ey))
            scale(.08);
    }
}

@keyframes staubTrail {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(.2);
    }

    20% {
        opacity: .8;
        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .25),
                calc(var(--dy) * .25)
            )
            scale(1);
    }

    65% {
        opacity: .55;
        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .65),
                calc(var(--dy) * .65)
            )
            scale(.8);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.2);
    }
}

.klick-flash {
    position: fixed;
    left: 0;
    top: 0;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 100000;
    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fff6a0 25%,
            #ffd000 50%,
            #ff7800 75%,
            transparent 100%
        );
    box-shadow:
        0 0 5px #fff000,
        0 0 12px #ffad00,
        0 0 22px #ff6500;
    transform:
        translate(-50%, -50%)
        scale(0);
    animation:
        flash .42s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes flash {
    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0);
    }

    15% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.8);
    }

    45% {
        opacity: .8;
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.15);
    }
}


/* SSL-Siegel: immer oben rechts am gesamten Container, unabhängig vom Logo */
.ssl-link{
    position:absolute;
    top:clamp(6px,1.5cqw,18px);
    right:clamp(6px,1.5cqw,18px);
    width: clamp(35px, 5cqw, 70px);
    height:auto;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:30;
    text-decoration:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}
.ssl-link img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    transition:transform .3s ease,filter .3s ease;
}
@media(hover:hover) and (pointer:fine){
    .ssl-link:hover img{transform:scale(1.2);filter:brightness(1.5) drop-shadow(0 0 5px orange)}
}
.ssl-link:focus-visible{outline:2px solid orange;outline-offset:3px}
@media(hover:none){.ssl-link:active img{transform:scale(1.1);filter:brightness(1.5) drop-shadow(0 0 5px orange)}}
@media(prefers-reduced-motion:reduce){.ssl-link img{transition:none!important}}
/* Moderne mobile Viewports mit dynamischen Browserleisten */
@supports(height:100dvh){html,body,.container{height:100dvh}}
</style>
</head>
<body>
<div class="container">
<a class="ssl-link" href="https://www.sunnysschaetze.de/rechtliche-hinweise/ssl-datensicherheit" target="_blank" rel="noopener noreferrer" aria-label="SSL-Datensicherheit"><img src="tempteria-ssl-so.png" alt="SSL Icon"></a>
<div class="bildbereich">
<img class="hintergrund" src="Sunnys Schätze Logo Steril ohne Schrift.png" alt="" width="2048" height="682" decoding="async" fetchpriority="high">
<div class="logo-wrapper" id="logo" role="button" tabindex="0" aria-label="RGB-Effekt aktivieren" aria-pressed="false">
<img class="rgb-glow" src="Sunnys Schätze Logo Steril Schrift.png" alt="" width="2048" height="684" decoding="async">
<img class="schrift" src="Sunnys Schätze Logo Steril Schrift.png" alt="Sunnys Schätze" width="2048" height="684" decoding="async" fetchpriority="high">
</div>
<div class="laufebene" aria-hidden="true"><div class="laufspur" id="laufspur">
<div class="sunny-runner sunny-nach-rechts"><img class="sunny-bild" src="Sunny the Dragon Slayer Rennt von Links nach Rechts.png" alt="" decoding="async"></div>
<div class="sunny-runner sunny-nach-links"><img class="sunny-bild" src="Sunny the Dragon Slayer Rennt von Rechts nach Links.png" alt="" decoding="async"></div>
</div></div></div></div>
<script>
const logo=document.getElementById("logo");
function toggleRGB(){const aktiv=logo.classList.toggle("aktiv");logo.setAttribute("aria-pressed",String(aktiv))}
logo.addEventListener("click",()=>{if(window.matchMedia("(hover: none)").matches)toggleRGB()});
logo.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleRGB()}});
const laufspur=document.getElementById("laufspur");
const sunny=laufspur.querySelector(".sunny-runner");
function laufstreckeAktualisieren(){const ziel=laufspur.clientWidth+sunny.offsetWidth*.1;laufspur.style.setProperty("--strecke-rechts",ziel+"px")}
laufstreckeAktualisieren();
if("ResizeObserver" in window){new ResizeObserver(laufstreckeAktualisieren).observe(laufspur)}else{window.addEventListener("resize",laufstreckeAktualisieren)}
/* =========================================================
   CURSOR-SYSTEM – REFERENZ
   ========================================================= */

let letzteX = 0;
let letzteY = 0;
let letzterSpawn = 0;
let aktiveGlitzer = 0;
const MAX_GLITZER = 180;

document.addEventListener(
    "mousemove",
    function(event) {
        erzeugeBewegungsEffekt(
            event.clientX,
            event.clientY
        );
    }
);

document.addEventListener(
    "touchmove",
    function(event) {
        if (!event.touches || !event.touches.length) {
            return;
        }

        const touch = event.touches[0];

        erzeugeBewegungsEffekt(
            touch.clientX,
            touch.clientY
        );
    },
    {
        passive: true
    }
);

document.addEventListener(
    "click",
    function(event) {
        klickEffekt(
            event.clientX,
            event.clientY
        );
    }
);

function erzeugeBewegungsEffekt(x, y) {
    const dx = x - letzteX;
    const dy = y - letzteY;

    const entfernung = Math.sqrt(
        dx * dx + dy * dy
    );

    const jetzt = performance.now();

    if (entfernung < 2) {
        return;
    }

    if (jetzt - letzterSpawn < 12) {
        letzteX = x;
        letzteY = y;
        return;
    }

    if (aktiveGlitzer >= MAX_GLITZER) {
        letzteX = x;
        letzteY = y;
        return;
    }

    const nx = dx / entfernung;
    const ny = dy / entfernung;

    const trailX = x;
    const trailY = y;

    createGlitzer(
        trailX,
        trailY,
        false,
        nx,
        ny
    );

    createStaub(trailX, trailY);
    createStaub(trailX, trailY);
    createStaub(
        trailX - nx * 6,
        trailY - ny * 6
    );
    createStaub(
        trailX - nx * 12,
        trailY - ny * 12
    );
    createStaub(
        trailX - nx * 25,
        trailY - ny * 25
    );
    createStaub(
        trailX - nx * 40,
        trailY - ny * 40
    );

    if (Math.random() > .68) {
        createGlitzer(
            trailX,
            trailY,
            true,
            nx,
            ny
        );
    }

    if (entfernung > 15) {
        createStaub(trailX, trailY);

        createStaub(
            trailX - nx * 15,
            trailY - ny * 15
        );

        createStaub(
            trailX - nx * 30,
            trailY - ny * 30
        );

        if (entfernung > 28) {
            createStaub(
                trailX - nx * 45,
                trailY - ny * 45
            );

            createStaub(
                trailX - nx * 60,
                trailY - ny * 60
            );
        }
    }

    letzterSpawn = jetzt;
    letzteX = x;
    letzteY = y;
}

function createGlitzer(
    x,
    y,
    grosser = false,
    nx = 0,
    ny = 0
) {
    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const el = document.createElement("div");

    el.className = grosser
        ? "glitzer long"
        : "glitzer";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size = grosser
        ? 10 + Math.random() * 5
        : 4 + Math.random() * 4;

    el.style.setProperty(
        "--color",
        color
    );

    el.style.setProperty(
        "--size",
        size + "px"
    );

    const seitlich =
        (Math.random() - .5) * 5;

    const px = -ny;
    const py = nx;

    const sx = px * seitlich;
    const sy = py * seitlich;

    const mx =
        sx - nx * (16 + Math.random() * 16);

    const my =
        sy - ny * (16 + Math.random() * 16);

    const ex =
        mx -
        nx * (32 + Math.random() * 35) +
        (Math.random() - .5) * 5;

    const ey =
        my -
        ny * (32 + Math.random() * 35) +
        (Math.random() - .5) * 5;

    el.style.setProperty(
        "--sx",
        sx + "px"
    );

    el.style.setProperty(
        "--sy",
        sy + "px"
    );

    el.style.setProperty(
        "--mx",
        mx + "px"
    );

    el.style.setProperty(
        "--my",
        my + "px"
    );

    el.style.setProperty(
        "--ex",
        ex + "px"
    );

    el.style.setProperty(
        "--ey",
        ey + "px"
    );

    const duration =
        900 + Math.random() * 550;

    el.style.setProperty(
        "--duration",
        duration + "ms"
    );

    el.style.left = x + "px";
    el.style.top = y + "px";

    aktiveGlitzer++;

    document.body.appendChild(el);

    setTimeout(() => {
        el.remove();
        aktiveGlitzer--;
    }, duration + 60);
}

function createStaub(x, y) {
    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const el = document.createElement("div");

    el.className = "staub";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size =
        1.5 + Math.random() * 2.5;

    el.style.setProperty(
        "--color",
        color
    );

    el.style.setProperty(
        "--staub-size",
        size + "px"
    );

    const startX =
        (Math.random() - .5) * 20;

    const startY =
        (Math.random() - .5) * 20;

    const dx =
        (Math.random() - .5) * 48;

    const dy =
        (Math.random() - .5) * 48;

    el.style.left =
        (x + startX) + "px";

    el.style.top =
        (y + startY) + "px";

    el.style.setProperty(
        "--dx",
        dx + "px"
    );

    el.style.setProperty(
        "--dy",
        dy + "px"
    );

    const duration =
        650 + Math.random() * 550;

    el.style.setProperty(
        "--duration",
        duration + "ms"
    );

    aktiveGlitzer++;

    document.body.appendChild(el);

    setTimeout(() => {
        el.remove();
        aktiveGlitzer--;
    }, duration + 60);
}

function klickEffekt(x, y) {
    const flash =
        document.createElement("div");

    flash.className = "klick-flash";

    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";

    document.body.appendChild(flash);

    for (let i = 0; i < 18; i++) {
        createExplosionsGlitzer(
            x,
            y,
            Math.random() > .65
        );
    }

    for (let i = 0; i < 18; i++) {
        createExplosionStaub(
            x,
            y
        );
    }

    setTimeout(() => {
        flash.remove();
    }, 500);
}

function createExplosionsGlitzer(
    x,
    y,
    grosser = false
) {
    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const el = document.createElement("div");

    el.className = grosser
        ? "glitzer long"
        : "glitzer";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size = grosser
        ? 13 + Math.random() * 8
        : 7 + Math.random() * 7;

    el.style.setProperty(
        "--color",
        color
    );

    el.style.setProperty(
        "--size",
        size + "px"
    );

    const winkel =
        Math.random() * Math.PI * 2;

    const distance = grosser
        ? 55 + Math.random() * 55
        : 35 + Math.random() * 70;

    const sx =
        (Math.random() - .5) * 6;

    const sy =
        (Math.random() - .5) * 6;

    const mx =
        Math.cos(winkel) *
        distance *
        .45;

    const my =
        Math.sin(winkel) *
        distance *
        .45;

    const ex =
        Math.cos(winkel) *
        distance;

    const ey =
        Math.sin(winkel) *
        distance;

    el.style.setProperty(
        "--sx",
        sx + "px"
    );

    el.style.setProperty(
        "--sy",
        sy + "px"
    );

    el.style.setProperty(
        "--mx",
        mx + "px"
    );

    el.style.setProperty(
        "--my",
        my + "px"
    );

    el.style.setProperty(
        "--ex",
        ex + "px"
    );

    el.style.setProperty(
        "--ey",
        ey + "px"
    );

    const duration =
        500 + Math.random() * 350;

    el.style.setProperty(
        "--duration",
        duration + "ms"
    );

    el.style.left =
        x + "px";

    el.style.top =
        y + "px";

    aktiveGlitzer++;

    document.body.appendChild(el);

    setTimeout(() => {
        el.remove();
        aktiveGlitzer--;
    }, duration + 60);
}

function createExplosionStaub(x, y) {
    if (aktiveGlitzer >= MAX_GLITZER) {
        return;
    }

    const el = document.createElement("div");

    el.className = "staub";

    const color =
        Math.random() > .5
            ? "#ff8500"
            : "#ffe000";

    const size =
        3 + Math.random() * 4;

    el.style.setProperty(
        "--color",
        color
    );

    el.style.setProperty(
        "--staub-size",
        size + "px"
    );

    const winkel =
        Math.random() * Math.PI * 2;

    const distance =
        35 + Math.random() * 75;

    const dx =
        Math.cos(winkel) * distance;

    const dy =
        Math.sin(winkel) * distance;

    el.style.left =
        x + "px";

    el.style.top =
        y + "px";

    el.style.setProperty(
        "--dx",
        dx + "px"
    );

    el.style.setProperty(
        "--dy",
        dy + "px"
    );

    const duration =
        450 + Math.random() * 400;

    el.style.setProperty(
        "--duration",
        duration + "ms"
    );

    aktiveGlitzer++;

    document.body.appendChild(el);

    setTimeout(() => {
        el.remove();
        aktiveGlitzer--;
    }, duration + 60);
}

</script>
</body>
</html>
