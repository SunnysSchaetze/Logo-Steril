<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunnys Schätze – RGB Logo</title>

<style>

/* =========================================
   GRUNDEINSTELLUNGEN
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: #000;
    overflow: hidden;
}

/* =========================================
   HAUPTCONTAINER
========================================= */

.container {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #000;
    overflow: hidden;
    isolation: isolate;

    container-type: size;
}

/* =========================================
   RESPONSIVER BILDBEREICH
========================================= */

.bildbereich {
    position: relative;

    width: min(100%, 1350px, 300cqh);
    aspect-ratio: 3 / 1;

    flex: none;

    background: #000;
    overflow: hidden;
}

/* =========================================
   HINTERGRUND
========================================= */

.hintergrund {
    position: absolute;
    inset: 0;

    display: block;
    width: 100%;
    height: 100%;

    object-fit: fill;
    pointer-events: none;

    z-index: 0;
}

/* Weiße Bildkante verdecken */
.bildbereich::after {
    content: "";

    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 6px;
    background: #000;

    z-index: 20;
    pointer-events: none;
}

/* =========================================
   SCHRIFT
========================================= */

.logo-wrapper {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 74%;

    transform: translate(-50%, -50%);
    transform-origin: center center;

    transition: transform 0.5s ease;

    z-index: 3;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.schrift {
    position: relative;

    display: block;
    width: 100%;
    height: auto;

    z-index: 2;
    pointer-events: none;
}

/* =========================================
   RGB-LEUCHTSCHICHT
========================================= */

.rgb-glow {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    opacity: 0;
    pointer-events: none;

    z-index: 1;
    transition: opacity 0.4s ease;
}

/* PC: Hover */
@media (hover: hover) and (pointer: fine) {

    .logo-wrapper:hover {
        transform:
            translate(-50%, -50%)
            scale(1.05);
    }

    .logo-wrapper:hover .rgb-glow {
        opacity: 0.9;
        animation: rgbBackground 8s linear infinite;
    }

    .logo-wrapper:hover .schrift {
        animation: rgbGlow 8s linear infinite;
    }
}

/* Smartphone: Antippen */
.logo-wrapper.aktiv {
    transform:
        translate(-50%, -50%)
        scale(1.05);
}

.logo-wrapper.aktiv .rgb-glow {
    opacity: 0.9;
    animation: rgbBackground 8s linear infinite;
}

.logo-wrapper.aktiv .schrift {
    animation: rgbGlow 8s linear infinite;
}

/* RGB-Farben */
@keyframes rgbGlow {

    0%, 100% {
        filter:
            drop-shadow(0 0 10px red)
            drop-shadow(0 0 25px red);
    }

    16% {
        filter:
            drop-shadow(0 0 10px magenta)
            drop-shadow(0 0 25px magenta);
    }

    33% {
        filter:
            drop-shadow(0 0 10px blue)
            drop-shadow(0 0 25px blue);
    }

    50% {
        filter:
            drop-shadow(0 0 10px cyan)
            drop-shadow(0 0 25px cyan);
    }

    66% {
        filter:
            drop-shadow(0 0 10px lime)
            drop-shadow(0 0 25px lime);
    }

    83% {
        filter:
            drop-shadow(0 0 10px yellow)
            drop-shadow(0 0 25px yellow);
    }
}

@keyframes rgbBackground {

    0%, 100% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px red);
    }

    16% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px magenta);
    }

    33% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px blue);
    }

    50% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px cyan);
    }

    66% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px lime);
    }

    83% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px yellow);
    }
}

/* =========================================
   SUNNY-LAUFANIMATION
========================================= */

/*
   Gesamter Zyklus: 24 Sekunden

   0–12 Sekunden:
   Sunny läuft von links nach rechts.

   12–24 Sekunden:
   Sunny läuft von rechts nach links.
*/

.laufebene {
    position: absolute;
    inset: 0;

    z-index: 10;

    overflow: hidden;
    pointer-events: none;
}

/* Laufstrecke unten im Bild */
.laufspur {
    position: absolute;

    left: 0;
    bottom: 2%;

    width: 100%;
    height: 58%;

    pointer-events: none;
}

/* Sunny-Größe */
.sunny-runner {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 15%;
    height: auto;

    display: block;

    opacity: 0;

    transform-origin: 50% 85%;
    backface-visibility: hidden;

    pointer-events: none;
}

/*
   Die Figur bewegt sich mit transform.
   Das ist effizienter als die Animation
   der CSS-Eigenschaft left.
*/

.sunny-nach-rechts {
    animation:
        laufRechts 24s linear infinite;
}

.sunny-nach-links {
    animation:
        laufLinks 24s linear infinite;
}

/* =========================================
   NATÜRLICHER LAUFSCHRITT
========================================= */

/*
   Leichte vertikale Bewegung
   und dezente Körperneigung.
*/

.sunny-bild {
    display: block;

    width: 100%;
    height: auto;

    transform-origin: 50% 85%;

    animation:
        laufSchritt 0.38s ease-in-out
        infinite alternate;
}

.sunny-nach-links .sunny-bild {
    animation-delay: -0.19s;
}

@keyframes laufSchritt {

    0% {
        transform:
            translateY(0)
            rotate(-1.2deg)
            scaleY(1);
    }

    100% {
        transform:
            translateY(-3%)
            rotate(1.2deg)
            scaleY(0.99);
    }
}

/* =========================================
   LINKS NACH RECHTS
========================================= */

/*
   15 % Bildbreite bedeutet:

   -120 % = knapp außerhalb links
    790 % = knapp außerhalb rechts

   Prozentwerte bei translateX beziehen
   sich auf die Breite der Figur.
*/

@keyframes laufRechts {

    0% {
        transform: translateX(-120%);
        opacity: 0;
    }

    2% {
        opacity: 1;
    }

    48% {
        opacity: 1;
    }

    50% {
        transform: translateX(790%);
        opacity: 0;
    }

    50.01%,
    100% {
        transform: translateX(-120%);
        opacity: 0;
    }
}

/* =========================================
   RECHTS NACH LINKS
========================================= */

@keyframes laufLinks {

    0%,
    49.99% {
        transform: translateX(790%);
        opacity: 0;
    }

    50% {
        transform: translateX(790%);
        opacity: 0;
    }

    52% {
        opacity: 1;
    }

    98% {
        opacity: 1;
    }

    100% {
        transform: translateX(-120%);
        opacity: 0;
    }
}

/* =========================================
   SMARTPHONE
========================================= */

@media (max-width: 767px) {

    .bildbereich {
        width: min(100%, 300cqh);
    }

    .bildbereich::after {
        height: 8px;
    }

    .logo-wrapper {
        width: 74%;
    }

    .laufspur {
        bottom: 2%;
        height: 60%;
    }

    /* Etwas größer für bessere Erkennbarkeit */
    .sunny-runner {
        width: 18%;
    }

    /*
       Die Laufstrecke wird für die
       Smartphone-Größe angepasst.
    */

    @keyframes laufRechts {

        0% {
            transform: translateX(-120%);
            opacity: 0;
        }

        2% {
            opacity: 1;
        }

        48% {
            opacity: 1;
        }

        50% {
            transform: translateX(680%);
            opacity: 0;
        }

        50.01%,
        100% {
            transform: translateX(-120%);
            opacity: 0;
        }
    }

    @keyframes laufLinks {

        0%,
        49.99% {
            transform: translateX(680%);
            opacity: 0;
        }

        50% {
            transform: translateX(680%);
            opacity: 0;
        }

        52% {
            opacity: 1;
        }

        98% {
            opacity: 1;
        }

        100% {
            transform: translateX(-120%);
            opacity: 0;
        }
    }
}

/* =========================================
   BARRIEREFREIHEIT
========================================= */

.logo-wrapper:focus-visible {
    outline: 2px solid cyan;
    outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {

    .logo-wrapper,
    .schrift,
    .rgb-glow,
    .sunny-runner,
    .sunny-bild {
        animation: none !important;
        transition: none !important;
    }

    .sunny-nach-rechts {
        opacity: 1;
        transform: translateX(10%);
    }

    .sunny-nach-links {
        display: none;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="bildbereich">

        <!-- Hintergrund -->
        <img
            class="hintergrund"
            src="Sunnys Schätze Logo Steril ohne Schrift.png"
            alt=""
            width="2048"
            height="682"
            decoding="async"
            fetchpriority="high"
        >

        <!-- RGB-Schrift -->
        <div
            class="logo-wrapper"
            id="logo"
            role="button"
            tabindex="0"
            aria-label="RGB-Effekt aktivieren"
            aria-pressed="false"
        >

            <!-- Leuchtschicht -->
            <img
                class="rgb-glow"
                src="Sunnys Schätze Logo Steril Schrift.png"
                alt=""
                width="2048"
                height="684"
                decoding="async"
            >

            <!-- Sichtbare Schrift -->
            <img
                class="schrift"
                src="Sunnys Schätze Logo Steril Schrift.png"
                alt="Sunnys Schätze"
                width="2048"
                height="684"
                decoding="async"
                fetchpriority="high"
            >

        </div>

        <!-- SUNNY IM VORDERGRUND -->
        <div class="laufebene" aria-hidden="true">

            <div class="laufspur">

                <!-- Sunny: links nach rechts -->
                <div class="sunny-runner sunny-nach-rechts">

                    <img
                        class="sunny-bild"
                        src="Sunny the Dragon Slayer Rennt von Links nach Rechts.png"
                        alt=""
                        decoding="async"
                    >

                </div>

                <!-- Sunny: rechts nach links -->
                <div class="sunny-runner sunny-nach-links">

                    <img
                        class="sunny-bild"
                        src="Sunny the Dragon Slayer Rennt von Rechts nach Links.png"
                        alt=""
                        decoding="async"
                    >

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const logo = document.getElementById("logo");

function toggleRGB() {

    const aktiv = logo.classList.toggle("aktiv");

    logo.setAttribute(
        "aria-pressed",
        String(aktiv)
    );
}

/* Smartphone: Antippen */
logo.addEventListener("click", function() {

    if (window.matchMedia("(hover: none)").matches) {
        toggleRGB();
    }

});

/* Tastatur: Enter und Leertaste */
logo.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" ||
        event.key === " "
    ) {
        event.preventDefault();
        toggleRGB();
    }

});

</script>

</body>
</html>
