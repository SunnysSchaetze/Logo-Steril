<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sunnys Schätze – RGB Logo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #000;
            overflow: hidden;
        }

        /* Google-Sites-Container */
        .container {
            position: relative;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
            isolation: isolate;
        }

        /*
         * GEMEINSAMER BILDBEREICH
         *
         * Passt sich automatisch der Breite
         * des Containers an.
         */
        .bildbereich {
            position: relative;

            width: 100%;
            max-width: 1350px;

            margin: 0 auto;

            flex-shrink: 1;
        }

        /* Hintergrund skaliert dynamisch */
        .hintergrund {
            display: block;

            width: 100%;
            height: auto;

            max-height: 100dvh;

            object-fit: contain;
            object-position: center;

            pointer-events: none;
        }

        /*
         * Schrift:
         * 74% der Hintergrundbreite.
         *
         * Keine feste Pixelgröße mehr!
         */
        .logo-wrapper {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 74%;

            transform: translate(-50%, -50%);
            transform-origin: center center;

            transition: transform 0.7s ease;

            z-index: 2;
            cursor: pointer;
        }

        /* Originalschrift */
        .schrift {
            display: block;
            position: relative;

            width: 100%;
            height: auto;

            z-index: 3;

            transition: filter 0.5s ease;
        }

        /* RGB-Leuchtschicht */
        .rgb-glow {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;
            pointer-events: none;

            z-index: 1;

            transition: opacity 0.7s ease;
        }

        /* Hover nur bei Geräten mit Maus */
        @media (hover: hover) and (pointer: fine) {

            .logo-wrapper:hover {
                transform:
                    translate(-50%, -50%)
                    scale(1.05);
            }

            .logo-wrapper:hover .rgb-glow {
                opacity: 0.9;
                animation: rgbBackground 8s linear infinite;
            }

            .logo-wrapper:hover .schrift {
                animation: rgbGlow 8s linear infinite;
            }
        }

        /* RGB-Farbwechsel */
        @keyframes rgbGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 10px red)
                    drop-shadow(0 0 25px red);
            }

            16% {
                filter:
                    drop-shadow(0 0 10px magenta)
                    drop-shadow(0 0 25px magenta);
            }

            33% {
                filter:
                    drop-shadow(0 0 10px blue)
                    drop-shadow(0 0 25px blue);
            }

            50% {
                filter:
                    drop-shadow(0 0 10px cyan)
                    drop-shadow(0 0 25px cyan);
            }

            66% {
                filter:
                    drop-shadow(0 0 10px lime)
                    drop-shadow(0 0 25px lime);
            }

            83% {
                filter:
                    drop-shadow(0 0 10px yellow)
                    drop-shadow(0 0 25px yellow);
            }
        }

        /* RGB-Hintergrundglühen */
        @keyframes rgbBackground {
            0%, 100% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px red);
            }

            16% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px magenta);
            }

            33% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px blue);
            }

            50% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px cyan);
            }

            66% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px lime);
            }

            83% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px yellow);
            }
        }

        /* Smartphone-Feinabstimmung */
        @media (max-width: 767px) {

            .container {
                width: 100%;
                height: 100dvh;
            }

            .bildbereich {
                width: 100%;
                max-width: 100%;
            }

            .logo-wrapper {
                width: 74%;
            }
        }

        /* Reduzierte Bewegung */
        @media (prefers-reduced-motion: reduce) {

            .logo-wrapper,
            .schrift,
            .rgb-glow {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Gemeinsamer skalierbarer Bildbereich -->
        <div class="bildbereich">

            <!-- Hintergrund -->
            <img
                class="hintergrund"
                src="Sunnys Schätze Logo Steril ohne Schrift.png"
                alt="Sunnys Schätze Hintergrund"
            >

            <!-- RGB-Schrift -->
            <div class="logo-wrapper">

                <!-- RGB-Leuchten -->
                <img
                    class="rgb-glow"
                    src="Sunnys Schätze Logo Steril Schrift.png"
                    alt=""
                >

                <!-- Originalschrift -->
                <img
                    class="schrift"
                    src="Sunnys Schätze Logo Steril Schrift.png"
                    alt="Sunnys Schätze Schrift"
                >

            </div>

        </div>

    </div>

</body>
</html>
