<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunnys Schätze – RGB Logo</title>

<style>

/* =========================================
   GRUNDEINSTELLUNGEN
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    border: 0;
    background: #000;
    overflow: hidden;
}

/* =========================================
   HAUPTCONTAINER
========================================= */

.container {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #000;
    overflow: hidden;
    isolation: isolate;

    container-type: size;
}

/* =========================================
   RESPONSIVER BILDBEREICH
========================================= */

.bildbereich {
    position: relative;

    width: min(100%, 1350px, 300cqh);
    aspect-ratio: 3 / 1;

    flex: none;

    background: #000;
    overflow: hidden;
}

/* =========================================
   HINTERGRUND
========================================= */

.hintergrund {
    position: absolute;
    inset: 0;

    display: block;
    width: 100%;
    height: 100%;

    object-fit: fill;
    pointer-events: none;

    z-index: 0;
}

/*
   Schwarzer Streifen gegen die weiße Kante.

   WICHTIG:
   z-index: 1

   Sunny liegt später auf z-index: 10.
   Dadurch bleiben die Füße sichtbar.
*/

.bildbereich::after {
    content: "";

    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 6px;
    background: #000;

    z-index: 1;
    pointer-events: none;
}

/* =========================================
   SCHRIFT
========================================= */

.logo-wrapper {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 74%;

    transform: translate(-50%, -50%);
    transform-origin: center center;

    transition: transform 0.5s ease;

    z-index: 3;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.schrift {
    position: relative;

    display: block;
    width: 100%;
    height: auto;

    z-index: 2;
    pointer-events: none;
}

/* =========================================
   RGB-LEUCHTSCHICHT
========================================= */

.rgb-glow {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    opacity: 0;
    pointer-events: none;

    z-index: 1;
    transition: opacity 0.4s ease;
}

/* PC: Hover */
@media (hover: hover) and (pointer: fine) {

    .logo-wrapper:hover {
        transform:
            translate(-50%, -50%)
            scale(1.05);
    }

    .logo-wrapper:hover .rgb-glow {
        opacity: 0.9;
        animation: rgbBackground 8s linear infinite;
    }

    .logo-wrapper:hover .schrift {
        animation: rgbGlow 8s linear infinite;
    }
}

/* Smartphone: Antippen */
.logo-wrapper.aktiv {
    transform:
        translate(-50%, -50%)
        scale(1.05);
}

.logo-wrapper.aktiv .rgb-glow {
    opacity: 0.9;
    animation: rgbBackground 8s linear infinite;
}

.logo-wrapper.aktiv .schrift {
    animation: rgbGlow 8s linear infinite;
}

/* =========================================
   RGB-FARBWECHSEL
========================================= */

@keyframes rgbGlow {

    0%, 100% {
        filter:
            drop-shadow(0 0 10px red)
            drop-shadow(0 0 25px red);
    }

    16% {
        filter:
            drop-shadow(0 0 10px magenta)
            drop-shadow(0 0 25px magenta);
    }

    33% {
        filter:
            drop-shadow(0 0 10px blue)
            drop-shadow(0 0 25px blue);
    }

    50% {
        filter:
            drop-shadow(0 0 10px cyan)
            drop-shadow(0 0 25px cyan);
    }

    66% {
        filter:
            drop-shadow(0 0 10px lime)
            drop-shadow(0 0 25px lime);
    }

    83% {
        filter:
            drop-shadow(0 0 10px yellow)
            drop-shadow(0 0 25px yellow);
    }
}

@keyframes rgbBackground {

    0%, 100% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px red);
    }

    16% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px magenta);
    }

    33% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px blue);
    }

    50% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px cyan);
    }

    66% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px lime);
    }

    83% {
        filter:
            blur(12px)
            drop-shadow(0 0 35px yellow);
    }
}

/* =========================================
   SUNNY-LAUFANIMATION
========================================= */

.laufebene {
    position: absolute;
    inset: 0;

    z-index: 10;

    overflow: hidden;
    pointer-events: none;
}

/*
   Sunny läuft am unteren Rand.

   Die Laufebene liegt über dem
   schwarzen Abdeckstreifen.
*/

.laufspur {
    position: absolute;

    left: 0;
    bottom: 3%;

    width: 100%;
    height: 58%;

    pointer-events: none;
}

/* Sunny auf PC */
.sunny-runner {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 15%;
    height: auto;

    display: block;
    opacity: 0;

    transform-origin: 50% 85%;
    backface-visibility: hidden;

    pointer-events: none;
}

/* Abwechselnde Laufrichtungen */
.sunny-nach-rechts {
    animation: laufRechts 24s linear infinite;
}

.sunny-nach-links {
    animation: laufLinks 24s linear infinite;
}

/* =========================================
   NATÜRLICHER LAUFSCHRITT
========================================= */

.sunny-bild {
    display: block;

    width: 100%;
    height: auto;

    transform-origin: 50% 85%;

    animation:
        laufSchritt 0.38s ease-in-out
        infinite alternate;
}

.sunny-nach-links .sunny-bild {
    animation-delay: -0.19s;
}

@keyframes laufSchritt {

    0% {
        transform:
            translateY(0)
            rotate(-1.2deg)
            scaleY(1);
    }

    100% {
        transform:
            translateY(-3%)
            rotate(1.2deg)
            scaleY(0.99);
    }
}

/* =========================================
   LAUFSTRECKE

   --sunny-breite steuert die Größe.
   Die Laufstrecke passt sich daran an.
========================================= */

.laufspur {
    --sunny-breite: 15%;
}

.sunny-runner {
    width: var(--sunny-breite);
}

/*
   Die Laufstrecke nutzt die Breite
   der gesamten Laufspur.

   Die Figur startet komplett außerhalb
   und verlässt das Bild vollständig.
*/

.sunny-nach-rechts {
    animation: laufRechts 24s linear infinite;
}

.sunny-nach-links {
    animation: laufLinks 24s linear infinite;
}

@keyframes laufRechts {

    0% {
        left: calc(-1 * var(--sunny-breite));
        opacity: 0;
    }

    2% {
        opacity: 1;
    }

    48% {
        opacity: 1;
    }

    50% {
        left: 100%;
        opacity: 0;
    }

    50.01%,
    100% {
        left: calc(-1 * var(--sunny-breite));
        opacity: 0;
    }
}

@keyframes laufLinks {

    0%,
    49.99% {
        left: 100%;
        opacity: 0;
    }

    50% {
        left: 100%;
        opacity: 0;
    }

    52% {
        opacity: 1;
    }

    98% {
        opacity: 1;
    }

    100% {
        left: calc(-1 * var(--sunny-breite));
        opacity: 0;
    }
}

/* =========================================
   SMARTPHONE-OPTIMIERUNG
========================================= */

@media (max-width: 767px) {

    .bildbereich {
        width: min(100%, 300cqh);
    }

    .logo-wrapper {
        width: 74%;
    }

    /*
       Schwarzer Streifen etwas schmaler,
       damit er optisch weniger auffällt.
    */
    .bildbereich::after {
        height: 5px;
    }

    /*
       Sunny sitzt etwas höher,
       damit die Füße frei bleiben.
    */
    .laufspur {
        bottom: 5%;
        height: 55%;

        --sunny-breite: 12%;
    }

    /*
       Kleinere Figur:
       12 % statt bisher 18 %.
    */
    .sunny-runner {
        width: var(--sunny-breite);
    }

    /*
       Laufschritt auf kleinen Displays
       etwas dezenter.
    */
    .sunny-bild {
        animation-duration: 0.42s;
    }
}

/* Sehr kleine Smartphones */
@media (max-width: 400px) {

    .laufspur {
        bottom: 6%;
        --sunny-breite: 11%;
    }

    .bildbereich::after {
        height: 5px;
    }
}

/* =========================================
   BARRIEREFREIHEIT
========================================= */

.logo-wrapper:focus-visible {
    outline: 2px solid cyan;
    outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {

    .logo-wrapper,
    .schrift,
    .rgb-glow,
    .sunny-runner,
    .sunny-bild {
        animation: none !important;
        transition: none !important;
    }

    .sunny-nach-rechts {
        opacity: 1;
        left: 5%;
    }

    .sunny-nach-links {
        display: none;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="bildbereich">

        <!-- Hintergrund -->
        <img
            class="hintergrund"
            src="Sunnys Schätze Logo Steril ohne Schrift.png"
            alt=""
            width="2048"
            height="682"
            decoding="async"
            fetchpriority="high"
        >

        <!-- RGB-Schrift -->
        <div
            class="logo-wrapper"
            id="logo"
            role="button"
            tabindex="0"
            aria-label="RGB-Effekt aktivieren"
            aria-pressed="false"
        >

            <!-- RGB-Leuchtschicht -->
            <img
                class="rgb-glow"
                src="Sunnys Schätze Logo Steril Schrift.png"
                alt=""
                width="2048"
                height="684"
                decoding="async"
            >

            <!-- Sichtbare Schrift -->
            <img
                class="schrift"
                src="Sunnys Schätze Logo Steril Schrift.png"
                alt="Sunnys Schätze"
                width="2048"
                height="684"
                decoding="async"
                fetchpriority="high"
            >

        </div>

        <!-- SUNNY IM VORDERGRUND -->
        <div class="laufebene" aria-hidden="true">

            <div class="laufspur">

                <!-- Sunny läuft nach rechts -->
                <div class="sunny-runner sunny-nach-rechts">

                    <img
                        class="sunny-bild"
                        src="Sunny the Dragon Slayer Rennt von Links nach Rechts.png"
                        alt=""
                        decoding="async"
                    >

                </div>

                <!-- Sunny läuft nach links -->
                <div class="sunny-runner sunny-nach-links">

                    <img
                        class="sunny-bild"
                        src="Sunny the Dragon Slayer Rennt von Rechts nach Links.png"
                        alt=""
                        decoding="async"
                    >

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const logo = document.getElementById("logo");

function toggleRGB() {

    const aktiv = logo.classList.toggle("aktiv");

    logo.setAttribute(
        "aria-pressed",
        String(aktiv)
    );
}

/* Smartphone: Antippen */
logo.addEventListener("click", function() {

    if (window.matchMedia("(hover: none)").matches) {
        toggleRGB();
    }

});

/* Tastatur */
logo.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" ||
        event.key === " "
    ) {
        event.preventDefault();
        toggleRGB();
    }

});

</script>

</body>
</html>
