<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sunnys Schätze – RGB Logo</title>

    <style>
        /* ========================================
           GRUNDEINSTELLUNGEN
        ======================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: #000;
            border: 0;

            overflow: hidden;
        }

        /* ========================================
           HAUPTCONTAINER
        ======================================== */

        .container {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0;
            padding: 0;

            background: #000;

            border: 0;
            outline: 0;
            box-shadow: none;

            overflow: hidden;
            isolation: isolate;
        }

        /* ========================================
           RESPONSIVER BILDBEREICH

           Hintergrundformat: ca. 3:1

           Skaliert proportional nach Breite
           UND verfügbarer Höhe.
        ======================================== */

        .bildbereich {
            position: relative;

            width: min(100%, 1350px, 300cqh);

            aspect-ratio: 3 / 1;

            margin: 0;
            padding: 0;

            flex: none;

            background: #000;

            border: 0;
            outline: 0;
            box-shadow: none;

            overflow: hidden;
        }

        /* Container-Höhe für cqh-Einheiten */
        .container {
            container-type: size;
        }

        /* ========================================
           HINTERGRUNDBILD
        ======================================== */

        .hintergrund {
            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

            object-fit: fill;

            border: 0;
            outline: 0;
            box-shadow: none;

            pointer-events: none;
        }

        /* ========================================
           WEISSE PNG-KANTE VERDECKEN
        ======================================== */

        .bildbereich::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 6px;

            background: #000;

            z-index: 5;
            pointer-events: none;
        }

        /* ========================================
           SCHRIFT

           74 % der Hintergrundbreite
           Exakt mittig positioniert
        ======================================== */

        .logo-wrapper {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 74%;

            transform: translate(-50%, -50%);
            transform-origin: center center;

            transition: transform 0.7s ease;

            z-index: 2;
            cursor: pointer;

            border: 0;
            outline: 0;
            box-shadow: none;

            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* ========================================
           ORIGINALSCHRIFT
        ======================================== */

        .schrift {
            position: relative;

            display: block;

            width: 100%;
            height: auto;

            z-index: 3;
            pointer-events: none;

            border: 0;
            outline: 0;
            box-shadow: none;

            transition: filter 0.5s ease;
        }

        /* ========================================
           RGB-LEUCHTSCHICHT
        ======================================== */

        .rgb-glow {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;
            pointer-events: none;

            z-index: 1;

            border: 0;
            outline: 0;
            box-shadow: none;

            transition: opacity 0.7s ease;
        }

        /* ========================================
           PC: HOVER-EFFEKT
        ======================================== */

        @media (hover: hover) and (pointer: fine) {

            .logo-wrapper:hover {
                transform:
                    translate(-50%, -50%)
                    scale(1.05);
            }

            .logo-wrapper:hover .rgb-glow {
                opacity: 0.9;

                animation:
                    rgbBackground 8s linear infinite;
            }

            .logo-wrapper:hover .schrift {
                animation:
                    rgbGlow 8s linear infinite;
            }
        }

        /* ========================================
           SMARTPHONE: ANTIPPEN
        ======================================== */

        .logo-wrapper.aktiv {
            transform:
                translate(-50%, -50%)
                scale(1.05);
        }

        .logo-wrapper.aktiv .rgb-glow {
            opacity: 0.9;

            animation:
                rgbBackground 8s linear infinite;
        }

        .logo-wrapper.aktiv .schrift {
            animation:
                rgbGlow 8s linear infinite;
        }

        /* ========================================
           RGB-FARBWECHSEL DER SCHRIFT
        ======================================== */

        @keyframes rgbGlow {

            0%, 100% {
                filter:
                    drop-shadow(0 0 10px red)
                    drop-shadow(0 0 25px red);
            }

            16% {
                filter:
                    drop-shadow(0 0 10px magenta)
                    drop-shadow(0 0 25px magenta);
            }

            33% {
                filter:
                    drop-shadow(0 0 10px blue)
                    drop-shadow(0 0 25px blue);
            }

            50% {
                filter:
                    drop-shadow(0 0 10px cyan)
                    drop-shadow(0 0 25px cyan);
            }

            66% {
                filter:
                    drop-shadow(0 0 10px lime)
                    drop-shadow(0 0 25px lime);
            }

            83% {
                filter:
                    drop-shadow(0 0 10px yellow)
                    drop-shadow(0 0 25px yellow);
            }
        }

        /* ========================================
           RGB-HINTERGRUNDGLÜHEN
        ======================================== */

        @keyframes rgbBackground {

            0%, 100% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px red);
            }

            16% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px magenta);
            }

            33% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px blue);
            }

            50% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px cyan);
            }

            66% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px lime);
            }

            83% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px yellow);
            }
        }

        /* ========================================
           TABLET UND SMARTPHONE
        ======================================== */

        @media (max-width: 767px) {

            .bildbereich {
                width: min(100%, 300cqh);
            }

            .logo-wrapper {
                width: 74%;
            }

            /* Zusätzliche PNG-Kantenabdeckung */
            .bildbereich::after {
                height: 8px;
            }
        }

        /* ========================================
           KLEINE SMARTPHONES
        ======================================== */

        @media (max-width: 400px) {

            .bildbereich::after {
                height: 8px;
            }
        }

        /* ========================================
           BARRIEREFREIHEIT
        ======================================== */

        .logo-wrapper:focus-visible {
            outline: 2px solid cyan;
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {

            .logo-wrapper,
            .schrift,
            .rgb-glow {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!--
            Gemeinsamer Bildbereich:
            Hintergrund und Schrift skalieren zusammen.
        -->

        <div class="bildbereich">

            <!-- Hintergrund -->
            <img
                class="hintergrund"
                src="Sunnys Schätze Logo Steril ohne Schrift.png"
                alt="Sunnys Schätze Hintergrund"
            >

            <!-- RGB-Schrift -->
            <div
                class="logo-wrapper"
                id="logo"
                role="button"
                tabindex="0"
                aria-label="RGB-Effekt für Sunnys Schätze aktivieren"
                aria-pressed="false"
            >

                <!-- RGB-Leuchten -->
                <img
                    class="rgb-glow"
                    src="Sunnys Schätze Logo Steril Schrift.png"
                    alt=""
                >

                <!-- Sichtbare Schrift -->
                <img
                    class="schrift"
                    src="Sunnys Schätze Logo Steril Schrift.png"
                    alt="Sunnys Schätze Schrift"
                >

            </div>

        </div>

    </div>

    <script>
        const logo = document.getElementById("logo");

        function istTouchGeraet() {
            return window.matchMedia(
                "(hover: none)"
            ).matches;
        }

        function effektUmschalten() {

            if (!istTouchGeraet()) {
                return;
            }

            const istAktiv =
                logo.classList.toggle("aktiv");

            logo.setAttribute(
                "aria-pressed",
                String(istAktiv)
            );
        }

        /* Smartphone: Antippen */
        logo.addEventListener(
            "click",
            effektUmschalten
        );

        /* Tastatur: Enter oder Leertaste */
        logo.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {
                    event.preventDefault();

                    const istAktiv =
                        logo.classList.toggle("aktiv");

                    logo.setAttribute(
                        "aria-pressed",
                        String(istAktiv)
                    );
                }
            }
        );
    </script>

</body>
</html>
