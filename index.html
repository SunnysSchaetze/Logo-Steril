<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunnys Schätze – RGB Logo mit laufendem Sunny</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: #000;
        overflow: hidden;
    }

    /* Gesamter Einbettungsbereich */
    .container {
        position: relative;
        width: 100%;
        height: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        margin: 0;
        padding: 0;

        background: #000;
        overflow: hidden;
        isolation: isolate;

        container-type: size;
    }

    /* Gemeinsamer, responsiver Bildbereich */
    .bildbereich {
        position: relative;

        width: min(100%, 1350px, 300cqh);
        aspect-ratio: 3 / 1;

        margin: 0;
        padding: 0;

        flex: none;
        background: #000;
        overflow: hidden;
    }

    /* Hintergrund */
    .hintergrund {
        position: absolute;
        inset: 0;

        display: block;
        width: 100%;
        height: 100%;

        object-fit: fill;
        pointer-events: none;

        z-index: 0;
    }

    /* Weiße PNG-Kante abdecken */
    .bildbereich::after {
        content: "";
        position: absolute;

        left: 0;
        right: 0;
        bottom: 0;

        height: 6px;
        background: #000;

        z-index: 10;
        pointer-events: none;
    }

    /* Schrift */
    .logo-wrapper {
        position: absolute;

        top: 50%;
        left: 50%;

        width: 74%;

        transform: translate(-50%, -50%);
        transform-origin: center;

        transition: transform 0.7s ease;

        z-index: 2;
        cursor: pointer;

        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    .schrift {
        position: relative;
        display: block;

        width: 100%;
        height: auto;

        z-index: 3;
        pointer-events: none;

        transition: filter 0.5s ease;
    }

    .rgb-glow {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: contain;

        opacity: 0;
        pointer-events: none;

        z-index: 1;
        transition: opacity 0.7s ease;
    }

    /* RGB am PC */
    @media (hover: hover) and (pointer: fine) {
        .logo-wrapper:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        .logo-wrapper:hover .rgb-glow {
            opacity: 0.9;
            animation: rgbBackground 8s linear infinite;
        }

        .logo-wrapper:hover .schrift {
            animation: rgbGlow 8s linear infinite;
        }
    }

    /* RGB auf Smartphone durch Antippen */
    .logo-wrapper.aktiv {
        transform: translate(-50%, -50%) scale(1.05);
    }

    .logo-wrapper.aktiv .rgb-glow {
        opacity: 0.9;
        animation: rgbBackground 8s linear infinite;
    }

    .logo-wrapper.aktiv .schrift {
        animation: rgbGlow 8s linear infinite;
    }

    @keyframes rgbGlow {
        0%, 100% {
            filter: drop-shadow(0 0 10px red)
                    drop-shadow(0 0 25px red);
        }
        16% {
            filter: drop-shadow(0 0 10px magenta)
                    drop-shadow(0 0 25px magenta);
        }
        33% {
            filter: drop-shadow(0 0 10px blue)
                    drop-shadow(0 0 25px blue);
        }
        50% {
            filter: drop-shadow(0 0 10px cyan)
                    drop-shadow(0 0 25px cyan);
        }
        66% {
            filter: drop-shadow(0 0 10px lime)
                    drop-shadow(0 0 25px lime);
        }
        83% {
            filter: drop-shadow(0 0 10px yellow)
                    drop-shadow(0 0 25px yellow);
        }
    }

    @keyframes rgbBackground {
        0%, 100% {
            filter: blur(12px)
                    drop-shadow(0 0 35px red);
        }
        16% {
            filter: blur(12px)
                    drop-shadow(0 0 35px magenta);
        }
        33% {
            filter: blur(12px)
                    drop-shadow(0 0 35px blue);
        }
        50% {
            filter: blur(12px)
                    drop-shadow(0 0 35px cyan);
        }
        66% {
            filter: blur(12px)
                    drop-shadow(0 0 35px lime);
        }
        83% {
            filter: blur(12px)
                    drop-shadow(0 0 35px yellow);
        }
    }

    /* =====================================
       LAUFENDE SUNNY-FIGUREN
    ===================================== */

    .laufebene {
        position: absolute;

        left: 0;
        right: 0;
        bottom: 1.5%;

        height: 43%;

        overflow: hidden;
        pointer-events: none;

        z-index: 8;
    }

    .sunny {
        position: absolute;

        bottom: 0;

        width: 19%;
        height: auto;

        display: block;
        pointer-events: none;

        will-change: left;
    }

    /*
       Gesamter Zyklus: 24 Sekunden

       0–12 Sekunden:
       Sunny läuft von links nach rechts.

       12–24 Sekunden:
       Sunny läuft von rechts nach links.
    */

    .sunny-links-rechts {
        left: -25%;
        animation: sunnyNachRechts 24s linear infinite;
    }

    .sunny-rechts-links {
        left: 105%;
        animation: sunnyNachLinks 24s linear infinite;
    }

    @keyframes sunnyNachRechts {
        0% {
            left: -25%;
            visibility: visible;
        }

        49.9% {
            left: 105%;
            visibility: visible;
        }

        50%, 100% {
            left: 105%;
            visibility: hidden;
        }
    }

    @keyframes sunnyNachLinks {
        0%, 49.9% {
            left: 105%;
            visibility: hidden;
        }

        50% {
            left: 105%;
            visibility: visible;
        }

        100% {
            left: -25%;
            visibility: visible;
        }
    }

    /* Smartphone */
    @media (max-width: 767px) {
        .bildbereich {
            width: min(100%, 300cqh);
        }

        .bildbereich::after {
            height: 8px;
        }

        .logo-wrapper {
            width: 74%;
        }

        .laufebene {
            height: 47%;
            bottom: 2%;
        }

        .sunny {
            width: 24%;
        }
    }

    /* Tastatur */
    .logo-wrapper:focus-visible {
        outline: 2px solid cyan;
        outline-offset: 4px;
    }

    /* Weniger Bewegung */
    @media (prefers-reduced-motion: reduce) {
        .logo-wrapper,
        .schrift,
        .rgb-glow,
        .sunny {
            animation: none !important;
            transition: none !important;
        }

        .sunny-links-rechts {
            left: 2%;
        }

        .sunny-rechts-links {
            display: none;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="bildbereich">

        <!-- Hintergrund -->
        <img
            class="hintergrund"
            src="Sunnys Schätze Logo Steril ohne Schrift.png"
            alt="Sunnys Schätze Hintergrund"
        >

        <!-- RGB-Schrift -->
        <div
            class="logo-wrapper"
            id="logo"
            role="button"
            tabindex="0"
            aria-label="RGB-Effekt aktivieren"
            aria-pressed="false"
        >

            <img
                class="rgb-glow"
                src="Sunnys Schätze Logo Steril Schrift.png"
                alt=""
            >

            <img
                class="schrift"
                src="Sunnys Schätze Logo Steril Schrift.png"
                alt="Sunnys Schätze"
            >

        </div>

        <!-- Sunny läuft im Vordergrund -->
        <div class="laufebene" aria-hidden="true">

            <!-- Links nach rechts -->
            <img
                class="sunny sunny-links-rechts"
                src="Sunny the Dragon Slayer Rennt von Links nach Rechts.png"
                alt=""
            >

            <!-- Rechts nach links -->
            <img
                class="sunny sunny-rechts-links"
                src="Sunny the Dragon Slayer Rennt von Rechts nach Links.png"
                alt=""
            >

        </div>

    </div>

</div>

<script>
    const logo = document.getElementById("logo");

    function effektUmschalten() {
        if (!window.matchMedia("(hover: none)").matches) {
            return;
        }

        const aktiv = logo.classList.toggle("aktiv");

        logo.setAttribute(
            "aria-pressed",
            String(aktiv)
        );
    }

    logo.addEventListener("click", effektUmschalten);

    logo.addEventListener("keydown", function(event) {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();

            const aktiv = logo.classList.toggle("aktiv");

            logo.setAttribute(
                "aria-pressed",
                String(aktiv)
            );
        }
    });
</script>

</body>
</html>
