<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunnys Schätze – RGB Logo</title>

    <style>
        /* Grundeinstellungen */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: #000;
            border: 0;

            overflow: hidden;
        }

        /* Hauptcontainer */
        .container {
            position: relative;

            width: 100%;
            height: 100%;
            min-height: 0;

            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000;

            border: 0;
            outline: 0;
            box-shadow: none;

            overflow: hidden;
            isolation: isolate;
        }

        /*
         * Gemeinsamer Bildbereich
         * Hintergrund und Schrift skalieren zusammen.
         */
        .bildbereich {
            position: relative;

            width: 100%;
            max-width: 1350px;

            margin: 0 auto;
            padding: 0;

            border: 0;
            outline: 0;
            box-shadow: none;

            flex-shrink: 1;
        }

        /* Hintergrund */
        .hintergrund {
            display: block;

            width: 100%;
            height: auto;

            max-height: 100%;

            object-fit: contain;
            object-position: center;

            border: 0;
            outline: 0;
            box-shadow: none;

            pointer-events: none;
        }

        /*
         * Schwarzer Streifen über dem unteren PNG-Rand
         * verdeckt eine mögliche weiße Bildkante.
         */
        .bildbereich::after {
            content: "";
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 4px;
            background: #000;

            z-index: 5;
            pointer-events: none;
        }

        /*
         * Schrift:
         * Immer 74 % der Hintergrundbreite.
         */
        .logo-wrapper {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 74%;

            transform: translate(-50%, -50%);
            transform-origin: center center;

            transition: transform 0.7s ease;

            z-index: 2;
            cursor: pointer;

            border: 0;
            box-shadow: none;

            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Originalschrift */
        .schrift {
            display: block;
            position: relative;

            width: 100%;
            height: auto;

            z-index: 3;
            pointer-events: none;

            border: 0;
            box-shadow: none;

            transition: filter 0.5s ease;
        }

        /* RGB-Leuchtschicht */
        .rgb-glow {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: contain;

            opacity: 0;
            pointer-events: none;

            z-index: 1;

            border: 0;
            box-shadow: none;

            transition: opacity 0.7s ease;
        }

        /* PC: Hover */
        @media (hover: hover) and (pointer: fine) {

            .logo-wrapper:hover {
                transform:
                    translate(-50%, -50%)
                    scale(1.05);
            }

            .logo-wrapper:hover .rgb-glow {
                opacity: 0.9;
                animation: rgbBackground 8s linear infinite;
            }

            .logo-wrapper:hover .schrift {
                animation: rgbGlow 8s linear infinite;
            }
        }

        /* Smartphone: Antippen */
        .logo-wrapper.aktiv {
            transform:
                translate(-50%, -50%)
                scale(1.05);
        }

        .logo-wrapper.aktiv .rgb-glow {
            opacity: 0.9;
            animation: rgbBackground 8s linear infinite;
        }

        .logo-wrapper.aktiv .schrift {
            animation: rgbGlow 8s linear infinite;
        }

        /* RGB-Farbwechsel */
        @keyframes rgbGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 10px red)
                    drop-shadow(0 0 25px red);
            }

            16% {
                filter:
                    drop-shadow(0 0 10px magenta)
                    drop-shadow(0 0 25px magenta);
            }

            33% {
                filter:
                    drop-shadow(0 0 10px blue)
                    drop-shadow(0 0 25px blue);
            }

            50% {
                filter:
                    drop-shadow(0 0 10px cyan)
                    drop-shadow(0 0 25px cyan);
            }

            66% {
                filter:
                    drop-shadow(0 0 10px lime)
                    drop-shadow(0 0 25px lime);
            }

            83% {
                filter:
                    drop-shadow(0 0 10px yellow)
                    drop-shadow(0 0 25px yellow);
            }
        }

        /* RGB-Hintergrundglühen */
        @keyframes rgbBackground {
            0%, 100% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px red);
            }

            16% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px magenta);
            }

            33% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px blue);
            }

            50% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px cyan);
            }

            66% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px lime);
            }

            83% {
                filter:
                    blur(12px)
                    drop-shadow(0 0 35px yellow);
            }
        }

        /* Smartphone-Anpassung */
        @media (max-width: 767px) {

            .container {
                width: 100%;
                height: 100%;
            }

            .bildbereich {
                width: 100%;
                max-width: 100%;
            }

            .logo-wrapper {
                width: 74%;
            }
        }

        /* Reduzierte Bewegung */
        @media (prefers-reduced-motion: reduce) {

            .logo-wrapper,
            .schrift,
            .rgb-glow {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Hintergrund und Schrift skalieren gemeinsam -->
        <div class="bildbereich">

            <!-- Hintergrund -->
            <img
                class="hintergrund"
                src="Sunnys Schätze Logo Steril ohne Schrift.png"
                alt="Sunnys Schätze Hintergrund"
            >

            <!-- RGB-Schrift -->
            <div
                class="logo-wrapper"
                id="logo"
                role="button"
                tabindex="0"
                aria-label="RGB-Effekt für Sunnys Schätze aktivieren"
                aria-pressed="false"
            >

                <!-- RGB-Leuchten -->
                <img
                    class="rgb-glow"
                    src="Sunnys Schätze Logo Steril Schrift.png"
                    alt=""
                >

                <!-- Originalschrift -->
                <img
                    class="schrift"
                    src="Sunnys Schätze Logo Steril Schrift.png"
                    alt="Sunnys Schätze Schrift"
                >

            </div>

        </div>

    </div>

    <script>
        const logo = document.getElementById("logo");

        function istTouchGeraet() {
            return window.matchMedia("(hover: none)").matches;
        }

        function effektUmschalten() {
            if (!istTouchGeraet()) {
                return;
            }

            const istAktiv = logo.classList.toggle("aktiv");

            logo.setAttribute(
                "aria-pressed",
                String(istAktiv)
            );
        }

        /* Smartphone: Antippen */
        logo.addEventListener("click", effektUmschalten);

        /* Tastaturbedienung */
        logo.addEventListener("keydown", function(event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();

                const istAktiv = logo.classList.toggle("aktiv");

                logo.setAttribute(
                    "aria-pressed",
                    String(istAktiv)
                );
            }
        });
    </script>

</body>
</html>
